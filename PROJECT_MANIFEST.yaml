  weight_source_after_survey: AHP or Best-Worst Method per vehicle segment
  hard_filters:
  - connector_compatible
  - operational
  - reachable_with_8pct_reserve
acceptance_tests:
- range model within +-15% of published/real-world range for 3 reference vehicles
- 'TOPSIS unit tests: ideal alternative scores 1.0; dominated alternative never wins; weights sum to 1'
- zero rank reversal on 4000 random problems with anchored bounds
- /recommend p95 latency < 500 ms for 200 candidate stations (local docker)
- every station returned by the API carries provenance fields
- corridor_spacing_v0 flags every > 25 km segment on test fixtures
data_sources:
  stations:
  - OpenStreetMap Overpass (amenity=charging_station)
  - Open Charge Map API
  - field census (primary data)
  vehicles:
  - Vahan public dashboard exports (district, class, fuel)
  - dataful.in mirrors (check licence)
  policy:
  - MoP/BEE charging guidelines
  - MP EV Policy 2025
  - MHI Rajya Sabha reply 27-03-2026 (state PCS table)
  tariff:
  - MPERC tariff orders
  - station-posted prices recorded in census
  synthetic_validation_only: research/01_cercos_pilot_experiments.py
known_risks:
- 'No public CPO real-time API: use census + survey + queueing model; live telemetry is a future module'
- 'No public historical session data for MP: ML phase starts from proxy data + our field counts'
- Official count (1,417 installed / 1,291 operational on 01-03-2026) is OMC-reported and undercounts other CPOs
