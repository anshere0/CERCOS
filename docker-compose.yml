services:
  db:
    image: postgis/postgis:16-3.4
    container_name: cercos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cercos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
      POSTGRES_DB: ${POSTGRES_DB:-cercos}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cercos} -d ${POSTGRES_DB:-cercos}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    container_name: cercos-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    working_dir: /app
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg://cercos:change_me@db:5432/cercos}
      - OSRM_URL=${OSRM_URL:-http://osrm:5000}
      - PYTHONPATH=/app/backend
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    image: node:20
    container_name: cercos-web
    restart: unless-stopped
    ports:
      - "5173:5173"
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: >
      sh -c "if [ -f package.json ]; then
               if [ -f package-lock.json ]; then npm ci; else npm install; fi &&
               npm run dev -- --host 0.0.0.0;
             else
               echo 'frontend not scaffolded yet' && tail -f /dev/null;
             fi"

volumes:
  pgdata:
